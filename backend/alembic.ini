# Alembic configuration file for Spendora backend.
# Run alembic commands from the backend/ directory.
#
# Workflow:
#   1. Make changes to SQLAlchemy models in app/models/
#   2. alembic revision --autogenerate -m "describe change"
#   3. MANUALLY REVIEW the generated file in alembic/versions/
#   4. alembic upgrade head
#
# sqlalchemy.url is intentionally left blank — it is injected at runtime
# in alembic/env.py from the DATABASE_URL environment variable.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

# Logging configuration ────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
