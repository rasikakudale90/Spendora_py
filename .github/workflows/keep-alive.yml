name: Keep Backend Warm (Zero Cold Starts)

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier instance from sleeping (spins down after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Sending keep-alive ping to Spendora Render Backend..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://spendora-backend.onrender.com/health || echo "000")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Backend is warm and responsive!"
          else
            echo "⚠️ Backend was cold or woke up with status $HTTP_STATUS."
          fi
