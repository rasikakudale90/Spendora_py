<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#3B82F6" opacity="0.15" filter="url(#glow)" />

  <!-- Stylized Spendora "S" + Financial Growth Symbol -->
  <path 
    d="M 330 160 C 330 130 300 110 256 110 C 200 110 170 140 170 175 C 170 230 340 215 340 310 C 340 365 295 402 240 402 C 180 402 150 365 150 330" 
    fill="none" 
    stroke="url(#brandGrad)" 
    stroke-width="48" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Growth Sparkle Accent Top Right -->
  <path 
    d="M 370 130 Q 370 160 395 160 Q 370 160 370 190 Q 370 160 345 160 Q 370 160 370 130 Z" 
    fill="#38BDF8" 
  />
  <circle cx="370" cy="160" r="3" fill="#FFFFFF" />
</svg>
