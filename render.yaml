# Render Blueprint for Spendora V1 Backend Web Service
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: spendora-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
        description: "PostgreSQL asyncpg connection string (e.g. postgresql+asyncpg://...)"
      - key: BUDGET_NEAR_LIMIT_THRESHOLD
        value: "0.80"
      - key: CORS_ORIGINS
        value: "*"
      - key: PORT
        value: "8000"
